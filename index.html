<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Letter Through Time - Brigitte & Cameron</title>


<style>

body {

    margin: 0;

    background: white;

    color: #222;

    font-family: "Times New Roman", Times, serif;

    overflow: hidden;

}


/* =====================
ENVELOPE INTRO
===================== */


#intro {

    position: fixed;

    inset: 0;

    background: white;

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 10;

}



.envelope {

    width: 260px;

    height: 170px;

    background: #f4f1ed;

    position: relative;

    border-radius: 5px;

    box-shadow: 0 15px 35px rgba(0,0,0,.08);

}



.envelope:before {

    content:"";

    position:absolute;

    top:0;

    left:0;

    border-left:130px solid transparent;

    border-right:130px solid transparent;

    border-top:90px solid #e8e1d8;

    transform-origin:top;

    animation:openFlap 1.8s ease forwards;

    animation-delay:1s;

}



.envelope-text {

    position:absolute;

    width:100%;

    top:75px;

    text-align:center;

    font-size:18px;

    letter-spacing:1px;

}



@keyframes openFlap {

    from {

        transform:rotateX(0);

    }

    to {

        transform:rotateX(180deg);

    }

}



.hideIntro {

    animation: fadeIntro 1.5s ease forwards;

}



@keyframes fadeIntro {

    to {

        opacity:0;

        visibility:hidden;

    }

}


/* =====================
MAIN CONTENT
===================== */


.container {

    min-height:650px;

    height:100vh;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding:40px 20px;

    box-sizing:border-box;

}



/* NAME TRANSITION */

.names {

    font-size:26px;

    margin-bottom:15px;

    opacity:0;

}



.names.show {

    animation:nameAppear 2s ease forwards;

}



@keyframes nameAppear {


    from {

        opacity:0;

        transform:translateY(-20px);

    }


    to {

        opacity:1;

        transform:translateY(0);

    }


}


/* OTHER CONTENT */


.content {

    opacity:0;

}



.content.show {

    animation:contentReveal 1.5s ease forwards;

}



@keyframes contentReveal {


    from {

        opacity:0;

    }


    to {

        opacity:1;

    }


}



h1 {

    font-size:46px;

    font-weight:normal;

    letter-spacing:1px;

    margin:0 0 25px;

}



.dates {

    font-size:18px;

    letter-spacing:1px;

    margin-bottom:55px;

    color:#555;

}



#countdown {

    display:flex;

    justify-content:center;

    gap:25px;

    flex-wrap:wrap;

}



.time {

    background:#f6f3ef;

    border-radius:14px;

    padding:22px 20px;

    min-width:90px;

}



.number {

    display:block;

    font-size:55px;

    line-height:1;

}



.label {

    font-size:13px;

    text-transform:uppercase;

    letter-spacing:2px;

    margin-top:12px;

}



.message {

    margin-top:60px;

    font-size:17px;

    font-style:italic;

}



@media(max-width:600px){


h1 {

font-size:34px;

}


.names {

font-size:22px;

}


.number {

font-size:40px;

}


.time {

min-width:70px;

padding:18px 14px;

}


}


</style>


</head>



<body>



<div id="intro">

<div class="envelope">

<div class="envelope-text">

For Brigitte & Cameron

</div>

</div>

</div>



<div class="container">


<div class="names" id="names">

Brigitte & Cameron

</div>



<div class="content" id="content">


<h1>

<strong>A Letter Through Time</strong>

</h1>



<div class="dates">

July 25, 2026

&nbsp; → &nbsp;

July 25, 2027

</div>



<div id="countdown">


<div class="time">

<span class="number" id="days">00</span>

<span class="label">Days</span>

</div>


<div class="time">

<span class="number" id="hours">00</span>

<span class="label">Hours</span>

</div>


<div class="time">

<span class="number" id="minutes">00</span>

<span class="label">Minutes</span>

</div>


<div class="time">

<span class="number" id="seconds">00</span>

<span class="label">Seconds</span>

</div>


</div>


<div class="message">

please return when the countdown reaches zero

</div>


</div>


</div>





<script>


// TIMING ANIMATION


setTimeout(()=>{


document.getElementById("intro").classList.add("hideIntro");


document.getElementById("names").classList.add("show");


},4000);



setTimeout(()=>{


document.getElementById("content").classList.add("show");


},6500);




// COUNTDOWN


const unlockDate = new Date("July 25, 2027 00:00:00").getTime();



function updateCountdown(){


const now = new Date().getTime();


const distance = unlockDate-now;



if(distance<=0){

document.getElementById("countdown").innerHTML="The moment has arrived.";

return;

}



document.getElementById("days").innerHTML=Math.floor(distance/(1000*60*60*24));


document.getElementById("hours").innerHTML=Math.floor((distance%(1000*60*60*24))/(1000*60*60));


document.getElementById("minutes").innerHTML=Math.floor((distance%(1000*60*60))/(1000*60));


document.getElementById("seconds").innerHTML=Math.floor((distance%(1000*60))/1000);


}



updateCountdown();

setInterval(updateCountdown,1000);



</script>


</body>

</html>
