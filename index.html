<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Letter Through Time - Brigitte & Cameron</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    background: #ffffff;

    color: #222;

    font-family: "Times New Roman", Times, serif;

    overflow: hidden;

}


/* =========================
INTRO SCENE
========================= */


#intro {

    position: fixed;

    inset: 0;

    background: white;

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 20;

}



.envelope {

    width: clamp(280px, 55vw, 420px);

    height: clamp(180px, 35vw, 260px);

    background: #f4f0ea;

    position: relative;

    border-radius: 8px;

    box-shadow:
    0 25px 50px rgba(0,0,0,0.12);

    transform: translateY(120vh);

    animation: envelopeRise 1.8s ease forwards;

}



@keyframes envelopeRise {


    from {

        transform: translateY(120vh);

    }


    to {

        transform: translateY(0);

    }


}



.envelope:before {

    content:"";

    position:absolute;

    top:0;

    left:0;

    width:0;

    height:0;

    border-left:50% solid transparent;

}



.envelope-flap {

    position:absolute;

    top:0;

    left:0;

    width:100%;

    height:55%;

    background:#e8dfd3;

    clip-path: polygon(0 0, 100% 0, 50% 100%);

    transform-origin:top;

    animation: openFlap 1.8s ease forwards;

    animation-delay:2s;

}



@keyframes openFlap {


    from {

        transform:rotateX(0deg);

    }


    to {

        transform:rotateX(180deg);

    }


}



.envelope-text {


    position:absolute;

    width:100%;

    top:50%;

    transform:translateY(-50%);

    text-align:center;

    font-size:clamp(28px, 5vw, 48px);

    font-style:italic;

    line-height:1.25;

    padding:20px;

}



.envelope-text span {

    display:block;

}





/* =========================
CARD REVEAL
========================= */



.card {

    position:absolute;

    width:min(90vw, 650px);

    min-height:520px;

    background:white;

    border-radius:25px;

    border:1px solid #ece7df;

    box-shadow:

    0 25px 60px rgba(0,0,0,0.15);

    padding:clamp(30px,5vw,60px);

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    transform:translateY(120vh);

    opacity:0;

}



.card.reveal {

    animation:

    cardRise 2s ease forwards;

}



@keyframes cardRise {


    from {

        transform:translateY(120vh);

        opacity:0;

    }


    to {

        transform:translateY(0);

        opacity:1;

    }


}



#intro.exit {

    animation:

    introExit 1.5s ease forwards;

}



@keyframes introExit {


    to {

        opacity:0;

        visibility:hidden;

    }


}





/* =========================
MAIN CONTENT
========================= */



.names {

    font-size:clamp(26px,4vw,38px);

    font-style:italic;

    white-space:nowrap;

    margin-bottom:25px;

    opacity:0;

    transform:translateY(40px);

}



.names.show {

    animation:

    nameMove 2s ease forwards;

}



@keyframes nameMove {


    from {

        opacity:0;

        transform:translateY(40px);

    }


    to {

        opacity:1;

        transform:translateY(0);

    }


}



.content {

    opacity:0;

}



.content.show {

    animation:

    fadeContent 1.8s ease forwards;

}



@keyframes fadeContent {


    from {

        opacity:0;

    }


    to {

        opacity:1;

    }


}



h1 {

    font-size:clamp(34px,5vw,52px);

    font-weight:normal;

    line-height:1.1;

    margin:0 0 25px;

}



.dates {

    font-size:clamp(16px,2.5vw,22px);

    font-style:italic;

    color:#555;

    margin-bottom:50px;

}



#countdown {

    display:grid;

    grid-template-columns:

    repeat(4, minmax(70px, 1fr));

    gap:20px;

    width:100%;

    max-width:520px;

}



.time {

    background:#f5f1eb;

    border-radius:16px;

    padding:20px 10px;

}



.number {

    display:block;

    font-size:clamp(32px,5vw,55px);

    line-height:1;

}



.label {

    margin-top:10px;

    font-size:12px;

    letter-spacing:2px;

    text-transform:uppercase;

}



.message {

    margin-top:45px;

    font-size:15px;

    font-style:italic;

    color:#666;

}



@media(max-width:600px){


.card {

    min-height:480px;

}


#countdown {

    grid-template-columns:

    repeat(2,1fr);

    gap:15px;

}


.names {

    font-size:24px;

}


}



</style>

</head>
<body>


<!-- INTRO ENVELOPE -->

<div id="intro">


<div class="envelope">


<div class="envelope-flap"></div>


<div class="envelope-text">

<span>For</span>

<span>Brigitte & Cameron</span>

</div>


</div>


</div>




<!-- FLOATING CARD -->

<div class="card" id="card">


<div class="names" id="names">

Brigitte & Cameron

</div>




<div class="content" id="content">


<h1>

<strong>A Letter<br class="mobile-break"> Through Time</strong>

</h1>



<div class="dates">

July 25, 2026

&nbsp; → &nbsp;

July 25, 2027

</div>




<div id="countdown">


<div class="time">

<span class="number" id="days">00</span>

<span class="label">Days</span>

</div>



<div class="time">

<span class="number" id="hours">00</span>

<span class="label">Hours</span>

</div>



<div class="time">

<span class="number" id="minutes">00</span>

<span class="label">Minutes</span>

</div>



<div class="time">

<span class="number" id="seconds">00</span>

<span class="label">Seconds</span>

</div>


</div>



<div class="message">

please return when the countdown reaches zero

</div>



</div>


</div>





<script>


/* =========================
REVEAL ANIMATION TIMING
========================= */


const intro = document.getElementById("intro");

const card = document.getElementById("card");

const names = document.getElementById("names");

const content = document.getElementById("content");





// Card pulls out of envelope

setTimeout(() => {


card.classList.add("reveal");


}, 3800);





// Envelope exits after card appears

setTimeout(() => {


intro.classList.add("exit");


}, 5200);





// Names appear first

setTimeout(() => {


names.classList.add("show");


}, 6200);





// Remaining content appears after names settle

setTimeout(() => {


content.classList.add("show");


}, 8200);







/* =========================
COUNTDOWN
========================= */


const unlockDate = new Date("July 25, 2027 00:00:00").getTime();




function updateCountdown(){


const now = new Date().getTime();


const distance = unlockDate - now;





if(distance <= 0){


document.getElementById("countdown").innerHTML =

"Your letter is ready.";


return;


}





const days = Math.floor(

distance / (1000 * 60 * 60 * 24)

);



const hours = Math.floor(

(distance % (1000 * 60 * 60 * 24))

/ (1000 * 60 * 60)

);



const minutes = Math.floor(

(distance % (1000 * 60 * 60))

/ (1000 * 60)

);



const seconds = Math.floor(

(distance % (1000 * 60))

/ 1000

);





document.getElementById("days").innerHTML = days;


document.getElementById("hours").innerHTML = hours;


document.getElementById("minutes").innerHTML = minutes;


document.getElementById("seconds").innerHTML = seconds;



}





updateCountdown();


setInterval(updateCountdown,1000);




</script>


</body>


</html>
