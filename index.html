<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Letter Through Time - Brigitte & Cameron</title>


<style>


* {
    box-sizing: border-box;
}



body {

    margin: 0;

    width: 100%;

    height: 100vh;

    overflow: hidden;

    background: #ffffff;

    color: #222;

    font-family: "Times New Roman", Times, serif;

}



/* ===========================
ENVELOPE INTRO
=========================== */


#intro {

    position: fixed;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    background: white;

    z-index: 5;

}



.envelope {

    position: relative;

    width: min(85vw, 560px);

    height: min(55vw, 340px);

    background: #f3eee6;

    border-radius: 12px;

    box-shadow:

    0 30px 70px rgba(0,0,0,0.15);

    transform: translateY(120vh);

    animation: envelopeEnter 1.8s ease forwards;

}



@keyframes envelopeEnter {


    from {

        transform: translateY(120vh);

    }


    to {

        transform: translateY(0);

    }


}



/* envelope flap */


.flap {

    position:absolute;

    top:0;

    left:0;

    width:100%;

    height:55%;

    background:#e7ddcf;

    clip-path: polygon(0 0, 100% 0, 50% 100%);

    transform-origin: top;

    z-index:2;

    animation: flapOpen 1.8s ease forwards;

    animation-delay:2s;

}



@keyframes flapOpen {


    from {

        transform:rotateX(0deg);

    }


    to {

        transform:rotateX(180deg);

    }


}



/* ===========================
MOVING COUPLE NAME
=========================== */


.moving-name {


    position:fixed;


    left:50%;


    top:50%;


    transform:


    translate(-50%,-50%);


    text-align:center;


    font-style:italic;


    white-space:nowrap;


    z-index:20;


    opacity:1;


    pointer-events:none;


}



.for-text {


    display:block;


    font-size:clamp(18px,2.5vw,30px);


    margin-bottom:12px;


}



.couple {


    display:block;


    font-size:clamp(38px,5vw,72px);


}



/* starting location over envelope */


.moving-name.envelope-position {


    top:50%;


}



/* final movement onto card */


.moving-name.move {


    animation: moveToCard 2.2s ease forwards;


}



@keyframes moveToCard {


    from {


        top:50%;


        transform:


        translate(-50%,-50%);


    }


    to {


        top:calc(50% - 170px);


        transform:


        translate(-50%,-50%);


    }


}



.moving-name.shrink .couple {


    animation: shrinkName 2.2s ease forwards;


}



@keyframes shrinkName {


    from {


        font-size:clamp(38px,5vw,72px);


    }


    to {


        font-size:clamp(25px,4vw,38px);


    }


}



.moving-name.hide-for .for-text {


    animation: removeFor 0.5s ease forwards;


}



@keyframes removeFor {


    to {


        opacity:0;


    }


}



/* ===========================
CARD
=========================== */


.card {


    position:fixed;


    top:50%;


    left:50%;


    width:min(90vw,680px);


    min-height:560px;


    transform:


    translate(-50%,120vh);


    background:white;


    border-radius:28px;


    border:1px solid #ebe5dd;


    box-shadow:


    0 35px 90px rgba(0,0,0,0.18);


    display:flex;


    justify-content:center;


    align-items:center;


    padding:


    clamp(30px,6vw,65px);


    text-align:center;


    opacity:0;


    z-index:10;


}



.card.show {


    animation: cardEnter 2s ease forwards;


}



@keyframes cardEnter {


    from {


        transform:


        translate(-50%,120vh);


        opacity:0;


    }


    to {


        transform:


        translate(-50%,-50%);


        opacity:1;


    }


}





/* ===========================
CONTENT
=========================== */


.content {


    opacity:0;


    width:100%;


}



.content.show {


    animation:fadeIn 1.5s ease forwards;


}



@keyframes fadeIn {


    from {

        opacity:0;

    }


    to {

        opacity:1;

    }


}



h1 {


    font-size:clamp(34px,5vw,52px);


    font-weight:normal;


    line-height:1.15;


    margin:30px 0 25px;


}



.dates {


    font-size:clamp(16px,2.5vw,22px);


    font-style:italic;


    color:#555;


    margin-bottom:45px;


}



/* ===========================
COUNTDOWN
=========================== */


#countdown {


    width:100%;


    max-width:540px;


    margin:auto;


    display:grid;


    grid-template-columns:repeat(4,1fr);


    gap:18px;


}



.time {


    background:#f5f1eb;


    border-radius:16px;


    padding:22px 10px;


}



.number {


    display:block;


    font-size:clamp(32px,5vw,55px);


}



.label {


    margin-top:10px;


    font-size:12px;


    text-transform:uppercase;


    letter-spacing:2px;


}



.message {


    margin-top:45px;


    font-size:14px;


    font-style:italic;


    color:#666;


}





@media(max-width:600px){


.envelope {


    width:92vw;


    height:58vw;


}



.couple {


    font-size:34px;


}



.card {


    width:92vw;


    min-height:500px;


    border-radius:22px;


}



#countdown {


    grid-template-columns:repeat(2,1fr);


}



h1 {


    font-size:34px;


}


}



</style>

</head>
<body>


<!-- ===========================
ENVELOPE
=========================== -->


<div id="intro">


    <div class="envelope">


        <div class="flap"></div>


    </div>


</div>




<!-- ===========================
MOVING NAME
(ONE SINGLE ELEMENT)
=========================== -->


<div 
class="moving-name envelope-position" 
id="movingName"
>


    <span class="for-text">
        For
    </span>


    <span class="couple">
        Brigitte & Cameron
    </span>


</div>





<!-- ===========================
CARD
=========================== -->


<div class="card" id="card">


<div class="content" id="content">



<h1>

<strong>
A Letter<br>
Through Time
</strong>

</h1>




<div class="dates">

July 25, 2026

&nbsp; → &nbsp;

July 25, 2027

</div>





<div id="countdown">


<div class="time">

<span class="number" id="days">
00
</span>

<span class="label">
Days
</span>

</div>




<div class="time">

<span class="number" id="hours">
00
</span>

<span class="label">
Hours
</span>

</div>




<div class="time">

<span class="number" id="minutes">
00
</span>

<span class="label">
Minutes
</span>

</div>




<div class="time">

<span class="number" id="seconds">
00
</span>

<span class="label">
Seconds
</span>

</div>


</div>





<div class="message">

please return when the countdown reaches zero

</div>




</div>


</div>






<script>


/* ===========================
ANIMATION SEQUENCE
=========================== */


const intro = document.getElementById("intro");

const card = document.getElementById("card");

const movingName = document.getElementById("movingName");

const content = document.getElementById("content");




// Envelope rises first automatically from CSS




// Card pulls upward from envelope

setTimeout(() => {


    card.classList.add("show");


}, 3800);





// Remove envelope after card arrives

setTimeout(() => {


    intro.style.opacity = "0";


    intro.style.visibility = "hidden";


}, 5600);





// Move the SAME couple name onto card

setTimeout(() => {


    movingName.classList.add("move");


    movingName.classList.add("shrink");


}, 6000);






// Remove "For" after movement begins

setTimeout(() => {


    movingName.classList.add("hide-for");


}, 7000);






// Reveal card contents

setTimeout(() => {


    content.classList.add("show");


}, 8200);







/* ===========================
COUNTDOWN
=========================== */


const unlockDate = new Date(

"July 25, 2027 00:00:00"

).getTime();





function updateCountdown(){



const now = new Date().getTime();



const distance = unlockDate - now;





if(distance <= 0){


document.getElementById("countdown").innerHTML =

"Your letter is ready.";


return;


}






const days = Math.floor(

distance /

(1000 * 60 * 60 * 24)

);





const hours = Math.floor(

(distance %

(1000 * 60 * 60 * 24))

/

(1000 * 60 * 60)

);






const minutes = Math.floor(

(distance %

(1000 * 60 * 60))

/

(1000 * 60)

);






const seconds = Math.floor(

(distance %

(1000 * 60))

/

1000

);






document.getElementById("days").innerHTML = days;


document.getElementById("hours").innerHTML = hours;


document.getElementById("minutes").innerHTML = minutes;


document.getElementById("seconds").innerHTML = seconds;


}




updateCountdown();


setInterval(updateCountdown,1000);



</script>



</body>

</html>
