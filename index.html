<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Letter Through Time - Brigitte & Cameron</title>


<style>


* {
    box-sizing: border-box;
}


body {

    margin: 0;

    height: 100vh;

    overflow: hidden;

    background: #ffffff;

    color: #222;

    font-family: "Times New Roman", Times, serif;

}



/* ==================================
ENVELOPE INTRO
================================== */


#intro {

    position: fixed;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    background: white;

    z-index: 10;

}



.envelope {

    width: min(85vw, 520px);

    height: min(55vw, 320px);

    background: #f4f0ea;

    border-radius: 10px;

    position: relative;

    box-shadow:

    0 30px 70px rgba(0,0,0,0.14);

    transform: translateY(120vh);

    animation: envelopeRise 1.8s ease forwards;

}



@keyframes envelopeRise {


    from {

        transform: translateY(120vh);

    }


    to {

        transform: translateY(0);

    }


}



/* Envelope flap */


.envelope-flap {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 55%;

    background: #e8dfd3;

    clip-path: polygon(0 0, 100% 0, 50% 100%);

    transform-origin: top;

    z-index: 2;

    animation: openFlap 1.8s ease forwards;

    animation-delay: 2s;

}



@keyframes openFlap {


    from {

        transform: rotateX(0deg);

    }


    to {

        transform: rotateX(180deg);

    }


}



/* The moving couple name */

.moving-name {

    position: absolute;

    left: 50%;

    top: 58%;

    transform:

    translate(-50%, -50%);

    text-align: center;

    font-style: italic;

    white-space: nowrap;

    z-index: 3;

}



.moving-name .for-text {

    display: block;

    font-size: clamp(20px, 3vw, 32px);

    margin-bottom: 10px;

}



.moving-name .couple {

    display: block;

    font-size: clamp(38px, 6vw, 70px);

}



/* ==================================
FLOATING CARD
================================== */


.card {

    position: fixed;

    top: 50%;

    left: 50%;

    transform:

    translate(-50%, 120vh);

    width: min(90vw, 680px);

    min-height: 540px;

    background: white;

    border-radius: 28px;

    border: 1px solid #ebe5dd;

    box-shadow:

    0 35px 80px rgba(0,0,0,0.16);

    padding:

    clamp(30px, 6vw, 65px);

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    opacity: 0;

    z-index: 5;

}



.card.show {

    animation: cardFloat 2s ease forwards;

}



@keyframes cardFloat {


    from {

        transform:

        translate(-50%, 120vh);

        opacity: 0;

    }


    to {

        transform:

        translate(-50%, -50%);

        opacity: 1;

    }


}





/* ==================================
MOVING NAME FINAL POSITION
================================== */


.moving-name.move {

    animation: moveName 2s ease forwards;

}



@keyframes moveName {


    from {


        top: 58%;


        left: 50%;


        transform:

        translate(-50%, -50%);


    }


    to {


        top: 18%;


        left: 50%;


        transform:

        translate(-50%, 0);


    }


}



.moving-name.final .for-text {

    display: none;

}



.moving-name.final .couple {

    font-size: clamp(26px, 4vw, 38px);

}



/* ==================================
CONTENT
================================== */


.content {

    opacity: 0;

}



.content.show {

    animation: contentFade 1.5s ease forwards;

}



@keyframes contentFade {


    from {

        opacity: 0;

    }


    to {

        opacity: 1;

    }


}



h1 {

    font-size:

    clamp(34px, 5vw, 52px);

    line-height: 1.15;

    font-weight: normal;

    margin: 35px 0 25px;

}



.dates {

    font-size:

    clamp(16px, 2.5vw, 22px);

    font-style: italic;

    color: #555;

    margin-bottom: 45px;

}



/* ==================================
COUNTDOWN
================================== */


#countdown {

    width: 100%;

    max-width: 540px;

    display: grid;

    grid-template-columns:

    repeat(4, 1fr);

    gap: 18px;

}



.time {

    background: #f5f1eb;

    border-radius: 16px;

    padding: 22px 10px;

}



.number {

    display: block;

    font-size:

    clamp(32px, 5vw, 55px);

}



.label {

    margin-top: 10px;

    font-size: 12px;

    text-transform: uppercase;

    letter-spacing: 2px;

}



.message {

    margin-top: 45px;

    font-size: 14px;

    font-style: italic;

    color: #666;

}



/* ==================================
MOBILE
================================== */


@media(max-width:600px){


.envelope {

    width: 90vw;

    height: 55vw;

}



.moving-name .couple {

    font-size: 34px;

}



.card {

    width: 92vw;

    min-height: 500px;

    border-radius: 22px;

}



#countdown {

    grid-template-columns:

    repeat(2,1fr);

}



h1 {

    font-size: 34px;

}



.moving-name.final .couple {

    font-size: 25px;

}



}

</style>

</head>
<body>



<!-- =========================
ENVELOPE SCENE
========================= -->


<div id="intro">


<div class="envelope">


<div class="envelope-flap"></div>



<div class="moving-name" id="movingName">


<span class="for-text">

For

</span>


<span class="couple">

Brigitte & Cameron

</span>


</div>



</div>


</div>





<!-- =========================
FLOATING CARD
========================= -->


<div class="card" id="card">





<div class="content" id="content">





<h1>

<strong>

A Letter<br>

Through Time

</strong>

</h1>





<div class="dates">

July 25, 2026

&nbsp; → &nbsp;

July 25, 2027

</div>






<div id="countdown">





<div class="time">


<span class="number" id="days">

00

</span>


<span class="label">

Days

</span>


</div>






<div class="time">


<span class="number" id="hours">

00

</span>


<span class="label">

Hours

</span>


</div>






<div class="time">


<span class="number" id="minutes">

00

</span>


<span class="label">

Minutes

</span>


</div>






<div class="time">


<span class="number" id="seconds">

00

</span>


<span class="label">

Seconds

</span>


</div>





</div>






<div class="message">

please return when the countdown reaches zero

</div>






</div>



</div>
<script>


/* =================================
ANIMATION SEQUENCE
================================= */


const intro = document.getElementById("intro");

const card = document.getElementById("card");

const movingName = document.getElementById("movingName");

const content = document.getElementById("content");





// 1. Card pulls out of envelope

setTimeout(() => {


    card.classList.add("show");


}, 4000);





// 2. Envelope slides away

setTimeout(() => {


    intro.classList.add("exit");


}, 5500);





// 3. SAME NAME MOVES FROM ENVELOPE TO CARD

setTimeout(() => {


    movingName.classList.add("move");


}, 6000);





// 4. Hide "For" after movement

setTimeout(() => {


    movingName.classList.add("final");


}, 7600);





// 5. Reveal the rest of the card

setTimeout(() => {


    content.classList.add("show");


}, 8200);








/* =================================
COUNTDOWN
================================= */



const unlockDate = new Date(

"July 25, 2027 00:00:00"

).getTime();





function updateCountdown(){



const now = new Date().getTime();



const distance = unlockDate - now;





if(distance <= 0){



document.getElementById("countdown").innerHTML =

"Your letter is ready.";



return;



}







const days = Math.floor(

distance /

(1000 * 60 * 60 * 24)

);





const hours = Math.floor(

(distance %

(1000 * 60 * 60 * 24))

/

(1000 * 60 * 60)

);






const minutes = Math.floor(

(distance %

(1000 * 60 * 60))

/

(1000 * 60)

);






const seconds = Math.floor(

(distance %

(1000 * 60))

/

1000

);







document.getElementById("days").innerHTML = days;



document.getElementById("hours").innerHTML = hours;



document.getElementById("minutes").innerHTML = minutes;



document.getElementById("seconds").innerHTML = seconds;



}





updateCountdown();



setInterval(updateCountdown,1000);



</script>



</body>

</html>
